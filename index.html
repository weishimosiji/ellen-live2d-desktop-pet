<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>艾莲桌宠</title><script src="/live2dcubismcore.min.js"></script></head><body><main class="desktop-shell">
<section class="stage" id="stage"><canvas id="live2d-canvas"></canvas><div id="startup-intro" class="startup-intro" aria-label="艾莲开场动画"><video id="startup-video" autoplay playsinline preload="auto"></video></div><span id="fps" class="fps">-- FPS</span></section>
<aside id="speech-bubble" class="ellen-speech" hidden><div class="voice-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p id="bubble-text"></p><small id="bubble-meta"></small></aside>
<aside id="timer-head" class="timer-head" hidden><strong id="timer-head-time">--:--</strong><small id="timer-head-task">倒计时</small></aside>
<nav class="tool-rail" aria-label="桌宠工具"><button id="chat-open" class="tool-button" title="文字对话" aria-label="文字对话"><span class="ui-icon icon-chat"></span></button><button id="todo-open" class="tool-button" title="待办日历" aria-label="待办日历"><span class="ui-icon icon-calendar"></span></button><button id="timer-open" class="tool-button" title="番茄钟" aria-label="番茄钟"><span class="ui-icon icon-timer"></span></button><button id="history-open" class="tool-button" title="历史记录" aria-label="历史记录"><span class="ui-icon icon-history"></span></button><button id="settings-open" class="tool-button" title="设置" aria-label="设置"><span class="ui-icon icon-settings"></span></button></nav>
<section hidden><p id="agent-result"></p><p id="status">准备载入</p><input id="follow" value="100"><output id="follow-value">100%</output><input id="tracking" type="checkbox" checked><input id="auto-blink" type="checkbox" checked><button id="reset"></button><div id="timer-list"></div></section></main>
<script type="module" src="/src/main.js"></script></body></html>
